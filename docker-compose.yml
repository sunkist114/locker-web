services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: lockerdb
      POSTGRES_USER: locker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Asia/Seoul
    # DB 포트는 외부에 노출하지 않음 (내부 네트워크만 사용)
    volumes:
      - locker_pgdata:/var/lib/postgresql/data

  app:
    build: .
    depends_on:
      - db
    # 8080은 nginx가 프록시하므로 외부 노출 불필요
    expose:
      - "8080"
    env_file:
      - .env
    environment:
      TZ: Asia/Seoul
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/lockerdb
      SPRING_DATASOURCE_USERNAME: locker
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      KAKAO_REST_KEY: ${KAKAO_REST_KEY}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET}
      KAKAO_REDIRECT_URI: ${KAKAO_REDIRECT_URI}
      KAKAO_STUDENT_PAGE_URL: ${KAKAO_STUDENT_PAGE_URL}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT}

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - app
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    # 12시간마다 자동 갱신
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"


volumes:
  locker_pgdata:
