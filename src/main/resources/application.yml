server:
  port: ${SERVER_PORT:8080}

spring:
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/lockerdb}
    username: ${SPRING_DATASOURCE_USERNAME:locker}
    password: ${SPRING_DATASOURCE_PASSWORD:lockerpass}

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

app:
  admin:
    username: ${APP_ADMIN_USERNAME:admin}
    password: ${APP_ADMIN_PASSWORD:}

  # ✅ 만료일(ISO-8601) - 예시: 2026-06-30 23:59:59 KST
  locker:
    expires-at: ${LOCKER_EXPIRES_AT:2027-03-05T23:59:59+09:00}

kakao:
  # ✅ 환경변수로 넣는 걸 권장
  rest-key: ${KAKAO_REST_KEY:}
  client-secret: ${KAKAO_CLIENT_SECRET:}
  redirect-uri: ${KAKAO_REDIRECT_URI:http://158.247.219.201/oauth/kakao/callback}
  student-page-url: ${KAKAO_STUDENT_PAGE_URL:http://158.247.219.201/student.html}
