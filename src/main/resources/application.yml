server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: native

spring:
  servlet:
    multipart:
      max-file-size: 30MB
      max-request-size: 30MB

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/lockerdb}
    username: ${SPRING_DATASOURCE_USERNAME:locker}
    password: ${SPRING_DATASOURCE_PASSWORD:lockerpass}

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

app:
  admin:
    username: ${APP_ADMIN_USERNAME:admin}
    password: ${APP_ADMIN_PASSWORD:}

  # ✅ 만료일(ISO-8601) - 예시: 2026-06-30 23:59:59 KST
  locker:
    expires-at: ${LOCKER_EXPIRES_AT:2027-03-05T23:59:59+09:00}

# ✅ Web Push VAPID 키 (생성: ./gradlew generateVapidKeys 또는 web-push-codelab 도구 사용)
# openssl ecparam -genkey -name prime256v1 -noout | openssl pkcs8 -topk8 -nocrypt -outform DER | base64 -w 0
vapid:
  public-key: ${VAPID_PUBLIC_KEY:}
  private-key: ${VAPID_PRIVATE_KEY:}
  subject: ${VAPID_SUBJECT:mailto:admin@example.com}

kakao:
  # ✅ 환경변수로 넣는 걸 권장
  rest-key: ${KAKAO_REST_KEY:}
  client-secret: ${KAKAO_CLIENT_SECRET:}
  redirect-uri: ${KAKAO_REDIRECT_URI:http://locker-cse.sch.ac.kr/oauth/kakao/callback}
  student-page-url: ${KAKAO_STUDENT_PAGE_URL:http://locker-cse.sch.ac.kr/student.html}
