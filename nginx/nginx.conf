events {
    worker_connections 1024;
}

http {
    client_max_body_size 35m;

    # HTTP → HTTPS 리다이렉트 (ACME 챌린지 제외)
    server {
        listen 80;
        server_name locker-cse.sch.ac.kr;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS
    server {
        listen 443 ssl;
        server_name locker-cse.sch.ac.kr;

        ssl_certificate     /etc/letsencrypt/live/locker-cse.sch.ac.kr/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/locker-cse.sch.ac.kr/privkey.pem;

        ssl_protocols             TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_session_cache         shared:SSL:10m;
        ssl_session_timeout       1d;

        # HSTS
        add_header Strict-Transport-Security "max-age=31536000" always;

        location = / {
            return 302 /student.html;
        }

        location / {
            proxy_pass         http://app:8080;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
    }
}
